steps:
  - name: gcr.io/cloud-builders/docker
    args:
      - build
      - --file=apps/web/Dockerfile
      - --build-arg=VITE_API_BASE_URL=${_API_URL}
      - --build-arg=VITE_DEMO_HINT=${_DEMO_HINT}
      - --tag=${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/web:${_TAG}
      - .
images:
  - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/web:${_TAG}
substitutions:
  _REGION: europe-west3
  _REPOSITORY: leadprocure
  _TAG: manual
  _API_URL: http://localhost:3000
  _DEMO_HINT: ""
timeout: 1800s

