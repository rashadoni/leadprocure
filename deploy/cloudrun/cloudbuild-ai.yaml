steps:
  - name: gcr.io/cloud-builders/docker
    args:
      - build
      - --file=services/ai-orchestrator/Dockerfile
      - --tag=${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/ai-orchestrator:${_TAG}
      - services/ai-orchestrator
images:
  - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/ai-orchestrator:${_TAG}
substitutions:
  _REGION: europe-west3
  _REPOSITORY: leadprocure
  _TAG: manual
timeout: 1200s

