name: Package API and web release images
on:
  workflow_dispatch:
    inputs:
      public_api_url:
        # БЕЗ `default` намеренно. Адрес вшивается в бандл при сборке и зависит от
        # состояния прода, которое меняется между релизами: 7 ноября прод переехал на
        # https://…:10443/api, и прежний адрес стал неверным. `default` подставляется
        # в поле формы «Run workflow», то есть человек, нажимающий кнопку, получает
        # устаревший адрес уже набранным — и он выглядит согласованным значением.
        # Дисциплина «брать адрес из живого .env.prod» (docs/prod-release-path.md,
        # шаг 2) спасает того, кто читает документ; того, кто нажимает кнопку, спасает
        # только пустое поле. При `required: true` пустой ввод запустить не даст.
        description: Browser-reachable API URL baked into web; take it from PUBLIC_API_URL in the live .env.prod
        required: true
  pull_request:
    paths:
      - .github/workflows/release-artifacts.yml
      - scripts/release/**
      - apps/api/Dockerfile
      - apps/web/Dockerfile
permissions:
  contents: read
jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      # Запас нужен и НЕ мёртв: на событии `pull_request` (ниже) входов нет вовсе, а
      # build-images.sh требует непустой PUBLIC_API_URL — без запаса упал бы каждый
      # PR-прогон упаковки. Но адрес здесь нарочно невозможный: `.invalid` —
      # зарезервированный домен, он не разрешается никогда, и ни один
      # продакшен-адрес в этом файле больше не стоит. `validateEndpoint` его
      # принимает (проверено), так что упаковка на PR по-прежнему собирается.
      PUBLIC_API_URL: ${{ inputs.public_api_url || 'http://pr-packaging-smoke.invalid' }}
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Verify artifact rejection cases
        run: node --test scripts/release/manifest.test.cjs
      - name: Build and package images without production access
        env:
          RELEASE_OUTPUT_DIR: ${{ runner.temp }}/leadprocure-release
        run: bash scripts/release/build-images.sh
      - name: Retain private downloadable release package
        uses: actions/upload-artifact@v4
        with:
          name: leadprocure-release-${{ github.sha }}
          path: |
            ${{ runner.temp }}/leadprocure-release/manifest.json
            ${{ runner.temp }}/leadprocure-release/leadprocure-images.tar.gz
          if-no-files-found: error
          retention-days: 7
