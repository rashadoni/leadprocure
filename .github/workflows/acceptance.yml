name: Isolated procurement acceptance
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: leadprocure_owner
          POSTGRES_PASSWORD: isolated_owner
          POSTGRES_DB: leadprocure_audit_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U leadprocure_owner -d leadprocure_audit_test"
          --health-interval 5s --health-timeout 5s --health-retries 15
      clamav:
        image: clamav/clamav:stable
        ports: ['3310:3310']
        options: >-
          --health-cmd "clamdscan --ping=1"
          --health-start-period 90s --health-interval 10s --health-timeout 5s --health-retries 30
    env:
      NODE_ENV: test
      LEADPROCURE_TEST_ISOLATED: '1'
      DATABASE_OWNER_URL: postgres://leadprocure_owner:isolated_owner@localhost:5432/leadprocure_audit_test
      DATABASE_URL: postgres://app_user:isolated_app@localhost:5432/leadprocure_audit_test
      JWT_ACCESS_SECRET: isolated-test-access-key-never-production
      JWT_REFRESH_SECRET: isolated-test-refresh-key-never-production
      BID_MASTER_KEY_B64: dGVzdC1vbmx5LW5vdC1hLXByb2R1Y3Rpb24ta2V5ISE=
      REFRESH_COOKIE_SECURE: 'false'
      CLAMAV_ENABLED: 'false'
      S3_ENDPOINT: http://localhost:9000
      S3_ACCESS_KEY: isolatedaccess
      S3_SECRET_KEY: isolatedsecret
      S3_BUCKET: leadprocure-audit-test
      AUDIT_EXPORT_DIR: /tmp/leadprocure-audit-exports
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: node scripts/acceptance/assert-isolated.cjs
      - run: pnpm install --frozen-lockfile
      - name: Bootstrap application role
        run: |
          psql "$DATABASE_OWNER_URL" -v ON_ERROR_STOP=1 <<'SQL'
          CREATE ROLE app_user LOGIN PASSWORD 'isolated_app' NOSUPERUSER NOBYPASSRLS;
          GRANT CONNECT ON DATABASE leadprocure_audit_test TO app_user;
          GRANT USAGE ON SCHEMA public TO app_user;
          ALTER DEFAULT PRIVILEGES FOR ROLE leadprocure_owner IN SCHEMA public GRANT SELECT, INSERT, UPDATE, DELETE ON TABLES TO app_user;
          ALTER DEFAULT PRIVILEGES FOR ROLE leadprocure_owner IN SCHEMA public GRANT USAGE, SELECT ON SEQUENCES TO app_user;
          SQL
      - name: Disposable object storage
        run: |
          curl -fL --retry 3 --connect-timeout 15 -o "$RUNNER_TEMP/minio" https://github.com/minio/minio/releases/download/RELEASE.2025-09-07T16-13-09Z/minio.linux-amd64.RELEASE.2025-09-07T16-13-09Z
          echo "7c5bd8512c6e966455b1d198209358b2d191c77a83ab377c4073281065fb855f  $RUNNER_TEMP/minio" | sha256sum -c -
          chmod +x "$RUNNER_TEMP/minio"
          MINIO_ROOT_USER=isolatedaccess MINIO_ROOT_PASSWORD=isolatedsecret "$RUNNER_TEMP/minio" server "$RUNNER_TEMP/minio-data" > /tmp/leadprocure-minio.log 2>&1 &
          for i in $(seq 1 30); do curl -fsS http://localhost:9000/minio/health/live && break || sleep 1; done
          curl -fsS http://localhost:9000/minio/health/live
          pnpm --filter api exec node -e "const {S3Client,CreateBucketCommand}=require('@aws-sdk/client-s3'); new S3Client({endpoint:process.env.S3_ENDPOINT,region:'us-east-1',forcePathStyle:true,credentials:{accessKeyId:process.env.S3_ACCESS_KEY,secretAccessKey:process.env.S3_SECRET_KEY}}).send(new CreateBucketCommand({Bucket:process.env.S3_BUCKET})).catch(e=>{console.error(e);process.exit(1)})"
      - run: pnpm build:shared
      - name: Upgrade from prior schema and reject historical duplicates safely
        run: pnpm --filter api exec node -r ts-node/register ../../scripts/acceptance/upgrade-check.cjs
      - run: pnpm --filter api migration:run
      - run: pnpm --filter api typecheck
      - name: Complete API regression and isolation suite
        run: |
          mkdir -p "$AUDIT_EXPORT_DIR"
          pnpm --filter api test:e2e
      - name: Official export schemas
        run: |
          python3 -m pip install lxml jsonschema
          python3 scripts/acceptance/validate_exports.py "$AUDIT_EXPORT_DIR"
      - run: pnpm build
      - name: Seed disposable browser fixtures
        timeout-minutes: 2
        run: pnpm --filter api seed
      - name: Install native Chromium
        timeout-minutes: 8
        run: pnpm --filter web exec playwright install --with-deps chromium
      - name: Start disposable API and web servers
        timeout-minutes: 2
        run: |
          node apps/api/dist/main.js > /tmp/leadprocure-api.log 2>&1 &
          pnpm --filter web exec vite preview --host 127.0.0.1 --port 5173 > /tmp/leadprocure-web.log 2>&1 &
          for i in $(seq 1 30); do curl -fsS http://localhost:3000/health && curl -fsS http://localhost:5173 && break || sleep 1; done
          curl -fsS http://localhost:3000/health
          curl -fsS http://localhost:5173
      - name: Native browser acceptance on disposable stack
        timeout-minutes: 10
        run: pnpm --filter web test:ui --workers=1 --max-failures=1
      - name: Preserve acceptance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: acceptance-evidence
          path: |
            apps/web/playwright-report
            apps/web/test-results
            /tmp/leadprocure-audit-exports
            /tmp/leadprocure-api.log
            /tmp/leadprocure-web.log
            /tmp/leadprocure-minio.log
      - name: Backup and restore disposable database
        run: bash scripts/acceptance/backup-restore.sh
