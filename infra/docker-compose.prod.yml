# Production/demo stack. Build context is the repo root so the pnpm workspace is visible.
#   cd infra && cp .env.prod.example .env.prod && edit secrets
#   docker compose -f docker-compose.prod.yml --env-file .env.prod up -d --build
# Own project name: both compose files live in infra/, and without this they would share
# the default "infra" project and `up` on one stack would replace the other's containers.
name: leadprocure-prod
services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_OWNER_USER:-leadprocure_owner}
      POSTGRES_PASSWORD: ${POSTGRES_OWNER_PASSWORD:?set in .env.prod}
      POSTGRES_DB: ${POSTGRES_DB:-leadprocure}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:?set in .env.prod before first boot}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_OWNER_USER:-leadprocure_owner} -d ${POSTGRES_DB:-leadprocure}"]
      interval: 5s
      timeout: 5s
      retries: 20

  minio:
    image: leadprocure-object-storage:source-7aac2a2
    build: ./storage
    pull_policy: build
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:?set in .env.prod}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:?set in .env.prod}
      # Browser presigned uploads come from the web app origin.
      MINIO_API_CORS_ALLOW_ORIGIN: ${WEB_ORIGIN}
    # Presigned URLs are used by the BROWSER: the S3 port must be reachable from outside
    # the compose network, and S3_PUBLIC_URL below must point at this public address.
    ports:
      - "9002:9000"   # 9002 on the host: the dev stack's minio already holds 9000
    volumes:
      - minio:/data

  createbuckets:
    image: leadprocure-object-storage:source-7aac2a2
    pull_policy: never
    depends_on:
      minio:
        condition: service_healthy
    environment:
      S3_ENDPOINT: http://minio:9000
      S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY}
      S3_BUCKET: ${S3_BUCKET:-leadprocure}
    entrypoint: ["/usr/local/bin/bootstrap-bucket.sh"]
    restart: "no"

  clamav:
    image: clamav/clamav:stable  # amd64 acceptance; other architectures require their own gate
    restart: unless-stopped
    volumes:
      - clamav:/var/lib/clamav
    healthcheck:
      test: ["CMD", "clamdscan", "--ping=1"]
      start_period: 90s
      interval: 10s
      timeout: 5s
      retries: 30

  ai-orchestrator:
    build:
      context: ../services/ai-orchestrator
    restart: unless-stopped
    environment:
      # Optional: set to enable LLM rationales (Claude); empty = transparent heuristic.
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      ANTHROPIC_MODEL: ${ANTHROPIC_MODEL:-claude-sonnet-5}

  api:
    build:
      context: ..
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      createbuckets:
        condition: service_completed_successfully
    environment:
      NODE_ENV: production
      API_PORT: 3000
      DEPLOYMENT_MODE: ${DEPLOYMENT_MODE:-cloud_multi_tenant}
      LICENSE_PUBLIC_KEY_B64: ${LICENSE_PUBLIC_KEY_B64:-}
      LICENSE_FILE: /run/leadprocure-license/leadprocure.license
      DATABASE_OWNER_URL: postgres://${POSTGRES_OWNER_USER:-leadprocure_owner}:${POSTGRES_OWNER_PASSWORD}@postgres:5432/${POSTGRES_DB:-leadprocure}
      DATABASE_URL: postgres://app_user:${APP_DB_PASSWORD:?set in .env.prod}@postgres:5432/${POSTGRES_DB:-leadprocure}
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:?set in .env.prod}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:?set in .env.prod}
      REFRESH_COOKIE_SECURE: ${REFRESH_COOKIE_SECURE:-true}
      BID_MASTER_KEY_B64: ${BID_MASTER_KEY_B64:?set in .env.prod}
      WEB_ORIGIN: ${WEB_ORIGIN:?set in .env.prod}
      S3_ENDPOINT: http://minio:9000
      # what the BROWSER can reach — presigned URLs are signed against this host
      S3_PUBLIC_ENDPOINT: ${S3_PUBLIC_URL:-http://localhost:9002}
      S3_BUCKET: ${S3_BUCKET:-leadprocure}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY}
      S3_FORCE_PATH_STYLE: "true"
      CLAMAV_ENABLED: ${CLAMAV_ENABLED:-false}
      CLAMAV_HOST: clamav
      AI_ORCHESTRATOR_URL: http://ai-orchestrator:8000
      WHATSAPP_APP_SECRET: ${WHATSAPP_APP_SECRET:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      MAIL_FROM: ${MAIL_FROM:-Leadprocure <no-reply@leadprocure.local>}
    ports:
      - "${API_HOST_PORT:-3000}:3000"
    volumes:
      - type: bind
        source: ${LICENSE_DIR:-./license}
        target: /run/leadprocure-license
        read_only: true
        bind:
          create_host_path: false

  # Единственный вход, который видит браузер, и единственное место, где есть TLS.
  # Веб и API за ним стоят на ОДНОМ origin (/api/), поэтому CORS перестаёт
  # участвовать, а refresh-куки становится однодоменной и получает Secure.
  # Хранилище — на своём порту: подпись presigned-ссылки покрывает путь, и
  # префикс её бы сломал. Подробности и причины — в nginx/leadprocure-tls.conf.
  #
  # Сертификат приходит снаружи, только на чтение: на хосте уже работает ACME
  # соседнего продукта, и сертификат выдан на САМ IP, так что домен не нужен.
  # Продлевает его чужой таймер, а nginx читает сертификат один раз при старте —
  # поэтому раз в шесть часов контейнер сам перезагружает конфиг.
  tls:
    image: nginx:1.27-alpine
    restart: unless-stopped
    # Профиль, а не обычная служба, и обе переменные со значениями по умолчанию —
    # по причине, которую поймал гейт, а не рассуждение. С `${VAR:?...}` файл
    # перестаёт РАЗБИРАТЬСЯ без этих переменных, то есть падает любая команда
    # compose, включая `up -d --no-deps api web` на проде и fresh-install в CI:
    # «required variable TLS_CERT_NAME is missing a value». Профиль же держит
    # службу вне обычного `up`: приёмка поднимает стек без неё, как и раньше.
    # Поднимать её так: `--profile tls up -d --no-build --no-deps tls`.
    profiles: ["tls"]
    environment:
      # имя каталога внутри certs/live — у сертификата на IP это сам адрес
      TLS_CERT_NAME: ${TLS_CERT_NAME:-not-configured}
    ports:
      - "${TLS_WEB_PORT:-10443}:443"
      - "${TLS_S3_PORT:-10444}:444"
    volumes:
      # Оба файла — ДЛИННОЙ формой с `create_host_path: false`, и источник берётся из
      # TLS_CONF_DIR, а не из каталога проекта. Причина замерена, а не предположена.
      #
      # Короткая форма `./nginx/x.conf:/dest:ro` при отсутствующем источнике не падает:
      # демон СОЗДАЁТ на его месте КАТАЛОГ и монтирует его. Внутри контейнера шаблон
      # становится каталогом, nginx поднимается «здоровым» и слушает только свой
      # дефолтный :80 — то есть прод остаётся без HTTPS и без входа, молча. Замерено.
      # С `create_host_path: false` тот же случай даёт внятный отказ демона
      # («bind source path does not exist») и не создаёт ничего — тоже замерено, и для
      # каталога, и для файла.
      #
      # Почему не каталог проекта: `--project-directory` на выкладке указывает в воркитри
      # выложенного SHA, и тогда живой конфиг прода лежит в каталоге, имя которого меняется
      # с каждым релизом. Предыдущий `release-<sha>` выглядит мусором, а снести его —
      # значит оставить прод без HTTPS при следующем рестарте. TLS_CONF_DIR — абсолютный
      # путь вне всяких чекаутов и воркитри, как LICENSE_DIR.
      #
      # Файлы туда копируются шагом выкладки, из выложенного SHA; `reload-loop.sh` должен
      # остаться ИСПОЛНЯЕМЫМ (копировать `cp -p`), иначе entrypoint пропустит его молча.
      - type: bind
        # шаблон, а не готовый конфиг: envsubst штатного образа подставит TLS_CERT_NAME
        source: ${TLS_CONF_DIR:-./nginx}/leadprocure-tls.conf
        target: /etc/nginx/templates/leadprocure-tls.conf.template
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        # цикл перезагрузки — шагом entrypoint'а, а НЕ подменой command: штатный
        # entrypoint отрисовывает шаблоны только когда команда начинается с «nginx»
        source: ${TLS_CONF_DIR:-./nginx}/reload-loop.sh
        target: /docker-entrypoint.d/50-reload-loop.sh
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        # путь по умолчанию намеренно не существует: `create_host_path: false`
        # даст внятную ошибку при запуске, а не тихую пустую папку
        source: ${TLS_CERT_DIR:-./nginx/certs-not-configured}
        target: /certs
        read_only: true
        bind:
          create_host_path: false

  web:
    build:
      context: ..
      dockerfile: apps/web/Dockerfile
      args:
        VITE_API_BASE_URL: ${PUBLIC_API_URL:?set in .env.prod (e.g. https://api.example.com)}
        # "1" shows seeded demo logins on the login page — demo stands only, never prod.
        VITE_DEMO_HINT: ${VITE_DEMO_HINT:-}
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "${WEB_HOST_PORT:-8080}:80"

volumes:
  pgdata:
  minio:
  clamav:
