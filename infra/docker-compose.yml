services:
  postgres:
    image: postgres:16
    container_name: leadprocure_postgres
    restart: unless-stopped
    environment:
      # Superuser = migration OWNER. The application does NOT connect with this role.
      POSTGRES_USER: leadprocure_owner
      POSTGRES_PASSWORD: owner_pass
      POSTGRES_DB: leadprocure
    ports:
      # Host 5433 to avoid clashing with a local (Homebrew) Postgres on 5432.
      - "55440:5432"
    volumes:
      - leadprocure_pgdata:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U leadprocure_owner -d leadprocure"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:latest
    container_name: leadprocure_minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
      # Allow browser presigned PUT uploads from the web dev origin.
      MINIO_API_CORS_ALLOW_ORIGIN: "*"
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - leadprocure_minio:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5

  clamav:
    image: clamav/clamav-debian:latest  # multi-arch (arm64 incl.); clamav/clamav lacks arm64
    container_name: leadprocure_clamav
    restart: unless-stopped
    ports:
      - "3310:3310"
    volumes:
      - leadprocure_clamav:/var/lib/clamav
    healthcheck:
      test: ["CMD-SHELL", "echo PING | nc -w 5 localhost 3310 | grep -q PONG"]
      interval: 30s
      timeout: 10s
      retries: 5

  # One-shot: create the bucket on first run.
  createbuckets:
    image: minio/mc:latest
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
      until mc alias set local http://minio:9000 minioadmin minioadmin; do sleep 1; done;
      mc mb -p local/leadprocure || true;
      mc anonymous set download local/leadprocure || true;
      echo done"
    restart: "no"

volumes:
  leadprocure_pgdata:
  leadprocure_minio:
  leadprocure_clamav:
