services:
  postgres:
    image: postgres:16
    container_name: leadprocure_postgres
    restart: unless-stopped
    environment:
      # Superuser = migration OWNER. The application does NOT connect with this role.
      POSTGRES_USER: leadprocure_owner
      POSTGRES_PASSWORD: owner_pass
      POSTGRES_DB: leadprocure
      APP_DB_PASSWORD: app_pass
    ports:
      # Host 5433 to avoid clashing with a local (Homebrew) Postgres on 5432.
      - "55440:5432"
    volumes:
      - leadprocure_pgdata:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U leadprocure_owner -d leadprocure"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: leadprocure-object-storage:source-7aac2a2
    build: ./storage
    pull_policy: build
    container_name: leadprocure_minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
      # Allow browser presigned PUT uploads from the web dev origin.
      MINIO_API_CORS_ALLOW_ORIGIN: "*"
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - leadprocure_minio:/data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5

  clamav:
    image: clamav/clamav:stable  # amd64 acceptance; other architectures require their own gate
    container_name: leadprocure_clamav
    restart: unless-stopped
    ports:
      - "3310:3310"
    volumes:
      - leadprocure_clamav:/var/lib/clamav
    healthcheck:
      test: ["CMD", "clamdscan", "--ping=1"]
      start_period: 90s
      interval: 30s
      timeout: 10s
      retries: 5

  # One-shot: create the bucket on first run.
  createbuckets:
    image: leadprocure-object-storage:source-7aac2a2
    pull_policy: never
    depends_on:
      minio:
        condition: service_healthy
    environment:
      S3_ENDPOINT: http://minio:9000
      S3_ACCESS_KEY: minioadmin
      S3_SECRET_KEY: minioadmin
      S3_BUCKET: leadprocure
    entrypoint: ["/usr/local/bin/bootstrap-bucket.sh"]
    restart: "no"

volumes:
  leadprocure_pgdata:
  leadprocure_minio:
  leadprocure_clamav:
