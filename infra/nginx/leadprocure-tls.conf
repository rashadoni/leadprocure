# TLS в один вход для веба, API и хранилища.
#
# Зачем он вообще: до него прод отдавался только по http на голый IP, то есть куки
# сессии и суммы в запечатанных предложениях шли по сети открытым текстом. Весь
# смысл продукта — что цену не видно до вскрытия, и на последнем участке он не
# выполнялся. REFRESH_COOKIE_SECURE при этом стоял `false` по необходимости:
# браузер выбрасывает Secure-куки, пришедшую по http.
#
# Сертификат НЕ выписывается здесь. На этом хосте уже работает ACME-клиент
# соседнего продукта, и выдан он на САМ IP (SAN = IP:75.119.156.234), а не на имя,
# поэтому домен для https не нужен. Каталог сертификата приходит снаружи, только
# на чтение, через TLS_CERT_DIR в .env.prod — чтобы в репозитории не было пути
# чужого продукта и чтобы при переезде менялась одна строка окружения.
#
# Продление идёт чужим таймером, а nginx читает сертификат один раз при старте,
# поэтому контейнер сам перезагружает конфиг раз в шесть часов (см. command в
# compose). Сертификат живёт неделю; шесть часов — с запасом.

# Отдельный файл карты не нужен: Upgrade/Connection для вебсокета шлюза /rt.
map $http_upgrade $connection_upgrade { default upgrade; '' close; }

server {
  listen 443 ssl;
  http2 on;
  server_name _;

  ssl_certificate     /certs/live/${TLS_CERT_NAME}/fullchain.pem;
  ssl_certificate_key /certs/live/${TLS_CERT_NAME}/privkey.pem;
  ssl_protocols TLSv1.2 TLSv1.3;
  ssl_session_cache shared:lp:10m;
  ssl_session_timeout 1h;

  # HSTS сознательно НЕ ставится. Сертификат выдан на IP и живёт неделю; заголовок
  # запер бы браузер на https прежде, чем продление доказано на нескольких циклах,
  # и ошибка продления стала бы недоступностью, а не предупреждением.

  # Адреса апстримов — в переменных, с резолвером Docker. Без этого nginx
  # резолвит имя один раз при старте, а api и web при каждой выкладке создаются
  # заново и получают новые адреса: вход отдавал бы 502 до перезапуска.
  resolver 127.0.0.11 valid=10s ipv6=off;

  # Веб и API на ОДНОМ origin: CORS пропадает целиком, а refresh-куки становится
  # однодоменной. Куки ставится без явного path, то есть на «/», поэтому браузер
  # отдаёт её и на /api/auth/refresh — см. identity.controller.ts.
  location /api/ {
    set $api_upstream http://api:3000;
    rewrite ^/api/(.*)$ /$1 break;
    proxy_pass $api_upstream;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_read_timeout 300s;
  }

  location / {
    set $web_upstream http://web:80;
    proxy_pass $web_upstream;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto https;
  }
}

# Хранилище — СВОЙ порт, а не префикс на том же. Подпись presigned-ссылки покрывает
# путь запроса, и срезанный префикс её ломает: браузер получил бы SignatureDoesNotMatch
# на каждой загрузке документа. С отдельным портом хост и путь совпадают с тем, что
# подписал API, и S3_PUBLIC_URL указывает прямо сюда.
server {
  listen 444 ssl;
  http2 on;
  server_name _;

  ssl_certificate     /certs/live/${TLS_CERT_NAME}/fullchain.pem;
  ssl_certificate_key /certs/live/${TLS_CERT_NAME}/privkey.pem;
  ssl_protocols TLSv1.2 TLSv1.3;

  # Загрузка идёт прямо в хранилище, минуя API, поэтому предел — у хранилища.
  client_max_body_size 0;

  resolver 127.0.0.11 valid=10s ipv6=off;
  location / {
    set $s3_upstream http://minio:9000;
    proxy_pass $s3_upstream;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto https;
  }
}
