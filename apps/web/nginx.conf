server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Keep browser authentication same-origin. Cloud Run gives the web and API
  # separate run.app hosts, where refresh cookies may otherwise be treated as
  # third-party cookies.
  location /api/socket.io/ {
    proxy_pass https://${API_UPSTREAM_HOST}/socket.io/;
    proxy_http_version 1.1;
    proxy_set_header Host ${API_UPSTREAM_HOST};
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_ssl_server_name on;
    proxy_ssl_name ${API_UPSTREAM_HOST};
    proxy_read_timeout 3600s;
  }

  location /api/ {
    proxy_pass https://${API_UPSTREAM_HOST}/;
    proxy_http_version 1.1;
    proxy_set_header Host ${API_UPSTREAM_HOST};
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_ssl_server_name on;
    proxy_ssl_name ${API_UPSTREAM_HOST};
  }

  # SPA fallback — every unknown path serves index.html so client routing works.
  location / {
    try_files $uri $uri/ /index.html;
  }

  location /assets/ {
    expires 30d;
    add_header Cache-Control "public, immutable";
  }
}
